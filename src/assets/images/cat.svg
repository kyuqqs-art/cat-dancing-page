<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Tail -->
  <path d="M155 170 Q185 140 175 110 Q170 95 180 85" fill="none" stroke="#FF8C42" stroke-width="6" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="160" rx="55" ry="45" fill="#FF8C42"/>

  <!-- Body stripes -->
  <path d="M65 145 Q100 135 135 145" fill="none" stroke="#E0752E" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 160 Q100 150 140 160" fill="none" stroke="#E0752E" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 175 Q100 165 135 175" fill="none" stroke="#E0752E" stroke-width="3" stroke-linecap="round"/>

  <!-- Left leg -->
  <rect x="65" y="190" width="18" height="25" rx="9" fill="#FF8C42"/>
  <!-- Left foot -->
  <ellipse cx="74" cy="215" rx="12" ry="5" fill="#FFB380"/>

  <!-- Right leg -->
  <rect x="117" y="190" width="18" height="25" rx="9" fill="#FF8C42"/>
  <!-- Right foot -->
  <ellipse cx="126" cy="215" rx="12" ry="5" fill="#FFB380"/>

  <!-- Left arm -->
  <rect x="42" y="140" width="14" height="35" rx="7" fill="#FF8C42" transform="rotate(-15 49 140)"/>

  <!-- Right arm -->
  <rect x="144" y="140" width="14" height="35" rx="7" fill="#FF8C42" transform="rotate(15 151 140)"/>

  <!-- Head -->
  <circle cx="100" cy="95" r="42" fill="#FF8C42"/>

  <!-- Left ear -->
  <polygon points="65,65 58,30 85,55" fill="#FF8C42"/>
  <polygon points="68,62 63,38 82,56" fill="#FFB380"/>

  <!-- Right ear -->
  <polygon points="135,65 142,30 115,55" fill="#FF8C42"/>
  <polygon points="132,62 137,38 118,56" fill="#FFB380"/>

  <!-- Face -->
  <!-- Left eye -->
  <ellipse cx="82" cy="90" rx="8" ry="9" fill="white"/>
  <ellipse cx="84" cy="91" rx="5" ry="6" fill="#2D2D2D"/>
  <circle cx="86" cy="88" r="2" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="118" cy="90" rx="8" ry="9" fill="white"/>
  <ellipse cx="120" cy="91" rx="5" ry="6" fill="#2D2D2D"/>
  <circle cx="122" cy="88" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,100 96,105 104,105" fill="#FF6B8A"/>

  <!-- Mouth -->
  <path d="M92 108 Q100 116 108 108" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="50" y1="95" x2="78" y2="100" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="105" x2="78" y2="105" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="115" x2="78" y2="110" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="150" y1="95" x2="122" y2="100" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="152" y1="105" x2="122" y2="105" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="122" y2="110" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <circle cx="70" cy="105" r="8" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="130" cy="105" r="8" fill="#FFB3C1" opacity="0.5"/>
</svg>
